[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
addopts = --strict-markers -ra
filterwarnings =
    ignore::DeprecationWarning:passlib.*

markers =
    integration: testes de integração (executar a partir da raiz: pytest -c ../pytest.ini)

[coverage:run]
source = app, scripts
omit =
    */__init__.py

[coverage:report]
show_missing = true
skip_empty = true
fail_under = 95
