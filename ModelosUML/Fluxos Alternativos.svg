@startuml
left to right direction
skinparam packageStyle rectangle
skinparam shadowing false

actor Usuario

rectangle "Sistema SolarCalc - Fluxos Alternativos" {
  usecase "Realizar simulacao solar" as UC1
  usecase "Exibir erro por consumo invalido" as UC2
  usecase "Exibir erro por localizacao invalida" as UC3
  usecase "Exibir erro por dados incompletos do imovel" as UC4
  usecase "Exibir alerta de telhado inadequado" as UC5
  usecase "Exibir baixa viabilidade" as UC6
  usecase "Sugerir ajustes na simulacao" as UC7
}

Usuario - -> UC1

UC2 .> UC1 : <<extend>>
UC3 .> UC1 : <<extend>>
UC4 .> UC1 : <<extend>>
UC5 .> UC1 : <<extend>>
UC6 .> UC1 : <<extend>>
UC7 .> UC6 : <<extend>>
@enduml

