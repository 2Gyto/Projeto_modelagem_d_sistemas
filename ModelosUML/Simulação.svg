@startuml
left to right direction
skinparam packageStyle rectangle
skinparam shadowing false

actor Usuario

rectangle "Sistema SolarCalc - Simulacao" {

  usecase "Realizar simulacao solar" as UC0

  usecase "Informar consumo mensal" as UC1
  usecase "Informar localizacao do imovel" as UC2
  usecase "Informar dados do imovel" as UC3
  usecase "Informar caracteristicas do telhado" as UC4

  usecase "Validar dados informados" as UC5
  usecase "Consultar incidencia solar da regiao" as UC6
  usecase "Analisar orientacao e inclinacao do telhado" as UC7
  usecase "Verificar sombra no telhado" as UC8

  usecase "Calcular geracao de energia" as UC9
  usecase "Calcular economia estimada" as UC10
  usecase "Calcular payback do investimento" as UC11
  usecase "Exibir resultado da viabilidade" as UC12

  usecase "Exibir mensagem de erro nos dados" as UC13
  usecase "Exibir baixa viabilidade" as UC14
  usecase "Sugerir ajustes na simulacao" as UC15
}

Usuario - -> UC0

UC0 .> UC1 : <<include>>
UC0 .> UC2 : <<include>>
UC0 .> UC3 : <<include>>
UC0 .> UC4 : <<include>>

UC0 .> UC5 : <<include>>
UC0 .> UC6 : <<include>>
UC0 .> UC7 : <<include>>
UC0 .> UC8 : <<include>>

UC0 .> UC9 : <<include>>
UC0 .> UC10 : <<include>>
UC0 .> UC11 : <<include>>
UC0 .> UC12 : <<include>>

UC13 .> UC0 : <<extend>>
UC14 .> UC12 : <<extend>>
UC15 .> UC14 : <<extend>>
@enduml

