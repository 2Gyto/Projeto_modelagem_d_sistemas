@startuml
left to right direction
skinparam packageStyle rectangle
skinparam shadowing false

actor Usuario

rectangle "Sistema SolarCalc - Persistencia e Painel" {
  usecase "Salvar simulacao no historico" as UC1
  usecase "Criar dashboard personalizado" as UC2
  usecase "Visualizar dashboard" as UC3
}

Usuario - -> UC3
UC2 .> UC1 : <<include>>
UC3 .> UC2 : <<include>>
@enduml

