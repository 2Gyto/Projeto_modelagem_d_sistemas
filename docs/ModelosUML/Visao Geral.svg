@startuml
left to right direction
skinparam packageStyle rectangle
skinparam shadowing false

actor Usuario

rectangle "Sistema SolarCalc - Visao Geral" {
  usecase "Cadastrar conta" as UC1
  usecase "Realizar login" as UC2
  usecase "Realizar simulacao solar" as UC3
  usecase "Visualizar historico de simulacoes" as UC4
  usecase "Visualizar dashboard" as UC5
}

Usuario - -> UC1
Usuario - -> UC2
Usuario - -> UC3
Usuario - -> UC4
Usuario - -> UC5
@enduml

