@startuml
left to right direction
skinparam packageStyle rectangle
skinparam shadowing false

actor Usuario

rectangle "Sistema SolarCalc - Acesso" {
  usecase "Cadastrar conta" as UC1
  usecase "Realizar login" as UC2
  usecase "Validar credenciais" as UC3
  usecase "Exibir mensagem de erro de login" as UC4
}

Usuario - -> UC1
Usuario - -> UC2

UC2 .> UC3 : <<include>>
UC4 .> UC2 : <<extend>>
@enduml

