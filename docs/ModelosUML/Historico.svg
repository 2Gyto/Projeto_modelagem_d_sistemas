@startuml
left to right direction
skinparam packageStyle rectangle
skinparam shadowing false

actor Usuario

rectangle "Sistema SolarCalc - Historico" {
  usecase "Visualizar historico de simulacoes" as UC1
  usecase "Consultar simulacao anterior" as UC2
  usecase "Visualizar detalhes da simulacao" as UC3
}

Usuario - -> UC1
Usuario - -> UC2
Usuario - -> UC3

UC1 .> UC2 : <<include>>
UC2 .> UC3 : <<include>>
@enduml

