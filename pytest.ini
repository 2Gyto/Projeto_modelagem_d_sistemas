[pytest]
testpaths = tests
pythonpath = . src/backend
asyncio_mode = auto
addopts = --strict-markers -ra -m integration
filterwarnings =
    ignore::DeprecationWarning:passlib.*

markers =
    integration: testes de integração entre módulos (banco real SQLite, HTTP, fakes)

[coverage:run]
source = app, scripts
omit =
    */__init__.py
    tests/*

[coverage:report]
show_missing = true
skip_empty = true
